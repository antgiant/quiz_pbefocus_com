name: Build question data

# Regenerates manifest.json (with chapter hashes), the per-season packs and the
# script-tag bundles whenever question or season data changes, so adding a year
# or new questions never needs a local build.
on:
  push:
    branches: [main]
    paths:
      - "questions/v1/by-chapter/**"
      - "questions/v1/practice-chapters-by-year.json"
      - "questions/v1/practice-books.json"
      - "questions/v1/years.json"
      - "scripts/build-data.mjs"
      - "scripts/build-local-bundle.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate manifest, packs and bundles
        run: |
          node scripts/build-data.mjs
          node scripts/build-local-bundle.mjs
      - name: Commit generated files
        run: |
          git add questions/v1
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate question manifest, packs and bundles [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
